name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Timeback.slnx
      - run: dotnet build Timeback.slnx -c Release --no-restore
      - name: Unit + application tests
        run: dotnet test Timeback.slnx -c Release --no-build --filter "FullyQualifiedName!~Integration"
      - name: Integration tests (Testcontainers / Docker)
        run: dotnet test tests/Timeback.Integration.Tests -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t timeback-api:ci .
      - run: docker build -t timeback-web:ci ./frontend
